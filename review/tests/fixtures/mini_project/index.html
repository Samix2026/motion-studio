<!doctype html>
<html lang="ar" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <title>Mini review fixture</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --brand-background: #131416;
        --brand-text: #ffffff;
        --brand-muted: #828282;
        --soft: #c9c9c9;
        --font-ar: "SF Arabic", Arial, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--brand-background); }
      #root { position: relative; width: 1920px; height: 1080px; background: var(--brand-background); }
      .clip { position: absolute; inset: 0; width: 100%; height: 100%; }
      .scene { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; direction: rtl; text-align: center; }
      .headline { font-family: var(--font-ar); font-size: 68px; color: var(--brand-text); }
      .sub { font-family: var(--font-ar); font-size: 24px; color: #6a6a6a; }
      .note { font-family: var(--font-ar); font-size: 28px; color: #a8a8a8; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-fps="30" data-width="1920" data-height="1080">
      <audio id="au-music" src="assets/audio/music/bed.wav" data-start="0" data-duration="8" data-volume="1"></audio>
      <audio id="au-click" src="assets/audio/sfx/click.wav" data-start="4.8" data-duration="0.2" data-volume="0.4"></audio>

      <section id="scene1" class="clip" data-start="0" data-duration="3.5" data-track-index="1">
        <div class="scene">
          <h1 id="s1h" class="headline">عنوان المشهد الاول</h1>
          <p id="s1s" class="sub">نص ثانوي قصير</p>
          <p id="s1x" class="note">ملاحظة</p>
        </div>
      </section>

      <section id="scene2" class="clip" data-start="3.5" data-duration="4.5" data-track-index="2">
        <div class="scene">
          <h1 id="s2h" class="headline">عنوان المشهد الثاني</h1>
          <p id="s2s" class="sub">نص ثانوي اخر</p>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const H = { opacity: 0, y: 40 };
      const HV = { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" };
      tl.fromTo("#s1h", H, HV, 0.5);
      tl.fromTo("#s1s", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 1.1);
      tl.fromTo("#s1x", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.0);
      tl.fromTo("#s2h", H, HV, 3.7);
      tl.fromTo("#s2s", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 4.2);
      const scenes = [3.5, 4.5];
      let acc = 0;
      scenes.forEach((d, i) => { tl.fromTo("#p" + (i + 1), { scaleX: 0 }, { scaleX: 1, duration: d, ease: "none" }, acc); acc += d; });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
