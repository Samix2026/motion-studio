<!doctype html>
<!--
  Motion Studio standard starter — 1920x1080 (16:9), 30 fps, Arabic RTL, silent.
  Copy to videos/<slug>/index.html together with lib/ and assets/fonts/.

  This file is the technical foundation only: fonts, type scale, safe zones,
  chrome, one paused timeline, motion primitives (MS.*). It does NOT decide what
  the viewer sees. Every scene below is designed from the project's visual story
  (storyboard.md: SEE / DOES / READ) and is replaced, not filled in.

  Per scene:
    data-visual="<role>"  what the scene shows: source-image | screenshot | interface |
                          object | diagram | data | footage | text  (any lower-case token)
    data-object           on a constructed visual element (a drawn object, bar, track, map…)
    data-grammar          optional layout helper from lib/grammars.json, chosen last
  At most one scene may be data-visual="text".
-->
<html lang="ar" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>[[عنوان الفيديو]]</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lib/motion.js"></script>
    <link rel="stylesheet" href="lib/type.css" />
    <link rel="stylesheet" href="lib/grammar.css" />
    <style>
      /* Required Arabic family (Alexandria, OFL — assets/fonts/OFL-Alexandria.txt). Keep inline. */
      @font-face {
        font-family: "Alexandria";
        src: url("assets/fonts/Alexandria-arabic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0897-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC;
      }
      @font-face {
        font-family: "Alexandria";
        src: url("assets/fonts/Alexandria-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      :root {
        /* brand:start — brands/generic.json */
        --brand-primary: #ffffff;
        --brand-secondary: #9c9c9c;
        --brand-background: #0a0a0a;
        --brand-background-gradient: radial-gradient(120% 90% at 50% 28%, #181818 0%, #0d0d0d 55%, #0a0a0a 100%);
        --brand-surface: #121212;
        --brand-text: #dcdcdc;
        --brand-muted: #9c9c9c;
        --brand-accent-gradient: linear-gradient(135deg, #ffffff 0%, #a6a6a6 100%);
        --brand-border-color: #2a2a2a;
        --brand-border-width: 2px;
        --brand-border-style: solid;
        --brand-radius: 26px;
        --brand-gap: 40px;
        --brand-image-fit: cover;
        --brand-image-position: center;
        --brand-image-scale: 1;
        --brand-headline-weight: 700;
        --brand-headline-tracking: -0.01em;
        --brand-highlight-color: #ffffff;
        --brand-credit-color: #8c8c8c;
        --brand-progress-fill: #ffffff;
        /* brand:end */
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--brand-background);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: var(--ms-font);
        background: var(--brand-background-gradient, var(--brand-background));
      }
      .logo {
        height: 34px;
        width: auto;
      }
      /* Scene-specific CSS for this video's visual objects goes here. */
      #s1obj {
        position: absolute;
        inset-inline: var(--zone-side);
        top: 50%;
        height: 12px;
        border-radius: 6px;
        background: var(--brand-accent-gradient, var(--brand-primary));
        transform-origin: right center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-format="landscape"
      data-start="0"
      data-duration="5"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <!--
        Placeholder scene. Replace it with the scenes from storyboard.md.
        SEE:  [[the object, asset, interface, diagram or environment on screen]]
        DOES: [[the motion that explains the idea]]
        READ: [[the minimum text]]
      -->
      <section id="s1" class="clip g-scene" data-visual="object" data-start="0" data-duration="5" data-track-index="1">
        <div id="s1obj" data-object></div>
        <div class="g">
          <p id="s1cap" class="t-caption">[[نص قصير يشرح ما يراه المشاهد]]</p>
        </div>
      </section>

      <div class="g-chrome-top" id="chromeTop">
        <span class="t-credit">تغطية مستقلة</span>
        <!-- brand logo, only where the brand profile allows it:
        <img class="logo" src="assets/<official-logo>.svg" alt="" /> -->
      </div>
      <div class="g-chrome-bottom" id="chromeBottom">
        <span class="t-credit">المصدر: [[الناشر]]</span>
        <span class="t-handle">@your_handle</span>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // chrome is on screen at frame 0
      tl.fromTo("#chromeTop", { opacity: 0.5 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);
      tl.fromTo("#chromeBottom", { opacity: 0.5 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);

      // placeholder scene: the object is visible at frame 0 and its motion carries the idea
      tl.fromTo("#s1obj", { scaleX: 0.2 }, { scaleX: 1, duration: 2.4, ease: "power2.inOut" }, 0);
      MS.enter.fadeScale(tl, "#s1cap", 0.6);

      MS.applyReviewAttributes(tl);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
